name: Sync official floor guide
on:
  schedule:
    - cron: "10 21 * * *"   # every day 06:10 KST
  workflow_dispatch:
  push:
    paths: [".github/workflows/sync-official.yml", "scripts/sync_official.py", "data/traced.json"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/sync_official.py
      - name: Commit if changed
        run: |
          git config user.name "official-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "공식 층별 안내 자동 동기화 $(date -u +%Y-%m-%d)"
          git push

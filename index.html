<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>신라면세점 서울점 매장 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1a73e8;--blue2:#1967d2;--red:#ea4335;--g1:#202124;--g2:#5f6368;--g3:#dadce0;--g4:#f1f3f4;--green:#188038}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,"Noto Sans KR","Noto Sans Thai","PingFang SC","Hiragino Sans","Microsoft JhengHei",sans-serif;color:var(--g1);background:#fff;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto;position:relative;overflow:hidden}
/* top directions card */
.top{position:relative;z-index:20;background:#fff;box-shadow:0 1px 4px #0003;padding:10px 10px 8px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;padding:0 2px 9px 4px;color:#202124}
.langw{display:flex;align-items:center;gap:4px;border:1px solid var(--g3);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px;flex:0 0 auto;cursor:pointer}
.langw .lang{border:0;padding:3px 2px;margin:0;font-weight:500;color:var(--blue);background:transparent;outline:none}
.dir{display:flex;align-items:stretch;gap:8px}
.pts{width:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px 0}
.pts .o{width:12px;height:12px;border-radius:50%;border:3px solid var(--blue);background:#fff}
.pts .dots{flex:1;width:2px;margin:4px 0;background:repeating-linear-gradient(var(--g2) 0 2px,transparent 2px 6px)}
.pts .d{width:12px;height:16px;position:relative}
.pts .d:before{content:"";position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red)}
.ins{flex:1;display:grid;gap:6px;min-width:0}
.inp{position:relative}
.inp input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--g3);border-radius:8px;background:var(--g4);outline:none;color:var(--g1)}
.inp input:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.side{display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:6px;width:64px}
.swap{width:40px;height:36px;border:0;background:none;font-size:20px;color:var(--g2);cursor:pointer}
.gobtn{width:64px;height:42px;border:0;border-radius:21px;background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px #0003;padding:0 4px;line-height:1.1}
.gobtn:disabled{background:#dadce0;color:#80868b;box-shadow:none;cursor:default}
.gobtn.stop{background:#d93025}
.list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border-radius:8px;max-height:46vh;overflow:auto;z-index:30;box-shadow:0 4px 16px #0003;display:none}
.list div{padding:11px 12px;border-bottom:1px solid var(--g4);font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.list div:hover{background:var(--g4)}
.list .ic{width:28px;height:28px;border-radius:50%;background:var(--g4);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px}
.list .tx{flex:1;min-width:0}
.list .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .tx span{font-size:12px;color:var(--g2)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;align-items:center}
.chip{flex:0 0 auto;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--g3);background:#fff;color:var(--g1);display:flex;align-items:center;gap:6px;cursor:pointer}
.chip svg{width:16px;height:16px}
.chip:active{background:var(--g4)}
.lang{margin-left:auto;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--g3);border-radius:999px;background:#fff}
/* map stage */
.stage{flex:1;position:relative;background:#fff;overflow:hidden;min-height:200px}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.navbar{position:absolute;left:10px;right:10px;top:10px;background:var(--green);color:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:12px;z-index:10;box-shadow:0 2px 8px #0004}
.navbar .ni{font-size:26px;width:34px;text-align:center}
.navbar .nt{font-size:17px;font-weight:500;line-height:1.3}
.navbar .ns{font-size:13px;opacity:.85}
.floors{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#fff;border-radius:8px;box-shadow:0 1px 4px #0004;display:flex;flex-direction:column;overflow:hidden;z-index:8}
.floors button{width:44px;height:38px;border:0;border-bottom:1px solid var(--g4);background:#fff;font:inherit;font-size:13px;font-weight:500;color:var(--g2);position:relative;cursor:pointer}
.floors button:last-child{border-bottom:0}
.floors button.on{background:#e8f0fe;color:var(--blue)}
.floors button i{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%}
.fab{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:8}
.fab button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px #0004;font-size:18px;color:var(--g2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab button.on{color:var(--blue)}
.zoom{position:absolute;left:10px;bottom:12px;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 1px 4px #0004;z-index:8;overflow:hidden}
.zoom button{width:40px;height:40px;border:0;background:#fff;font-size:20px;color:var(--g2);cursor:pointer}
.zoom button+button{border-top:1px solid var(--g4)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;white-space:nowrap;z-index:9;transition:opacity .5s}
.transfer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#ffffffd9;z-index:12;flex-direction:column;gap:10px}
.transfer .big{font-size:30px;font-weight:700;color:var(--g1);display:flex;align-items:center;gap:14px}
.transfer .big span{background:var(--blue);color:#fff;border-radius:10px;padding:6px 14px}
.transfer .sm{font-size:14px;color:var(--g2)}
/* bottom sheet */
.sheet{background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px #0002;z-index:15;max-height:44vh;overflow:auto;padding:6px 16px 16px;margin-top:-12px;position:relative}
.grab{width:36px;height:4px;border-radius:2px;background:var(--g3);margin:4px auto 10px}
.sum{display:flex;align-items:center;gap:12px}
.sum .tm{font-size:22px;font-weight:500}
.sum .tm small{font-size:15px;color:var(--g2);font-weight:400;margin-left:6px}
.sum .via{font-size:13px;color:var(--g2);margin-top:2px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{font:inherit;font-size:14px;font-weight:500;padding:9px 18px;border-radius:999px;border:1px solid var(--g3);background:#fff;color:var(--blue);cursor:pointer;display:flex;align-items:center;gap:6px}
.btns button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btns button:disabled{opacity:.45}
.steps{margin-top:12px;border-top:1px solid var(--g4)}
.st{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--g4);align-items:flex-start}
.st .si{width:28px;height:28px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--g2)}
.st .si svg{width:24px;height:24px}
.st .sx{font-size:14px;line-height:1.45}
.st .sx small{display:block;color:var(--g2);font-size:12px}
.st.cur .sx{color:var(--blue);font-weight:500}
.empty{color:var(--g2);font-size:14px;padding:4px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--g2);margin-top:12px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid #0001}
.note{font-size:11px;color:#80868b;line-height:1.5;margin-top:8px}
</style>
</head>

function drawChar(ts){const ph=ts/1000,sw=C.walk?Math.sin(ph*14)*28:0,bob=C.walk?Math.abs(Math.sin(ph*14))*1.1:Math.sin(ph*2.2)*.3;
  const st=sw/28;footL.setAttribute('transform',`translate(${st*1.6} 0)`);footR.setAttribute('transform',`translate(${-st*1.6} 0)`);
  skirt.setAttribute('transform',`rotate(${st*3} 0 -15)`);braid.setAttribute('transform',`rotate(${-st*6} 4.6 -24)`);
  armB.setAttribute('transform',`rotate(${-sw*.7} -5 -18.4)`);armF.setAttribute('transform',`rotate(${sw*.7} 5 -18.4)`);
  body.setAttribute('transform',`translate(0 ${-bob}) scale(${C.face} 1)`);halo.setAttribute('r',10+Math.sin(ph*3)*1.5);
  ch.setAttribute('transform',`translate(${C.x} ${C.y}) scale(${C.scale*0.82})`);ch.style.opacity=C.op;
  ch.style.display=viewFloor===C.floor?'':'none'}

/* ===== camera with pan / pinch ===== */
let cam=null;
function aspect(){const st=$('stage');return st.clientHeight/Math.max(1,st.clientWidth)}
function fitBox(x,y,w,h,pad){const ar=aspect();x-=pad;y-=pad;w+=pad*2;h+=pad*2;if(h/w<ar){const nh=w*ar;y-=(nh-h)/2;h=nh}else{const nw=h/ar;x-=(nw-w)/2;w=nw}return[x,y,w,h]}
function bounds(){const b=F[viewFloor].bg;return[b[0]-3,b[1]-3,b[2]+3,b[3]+3]}
function maxW(){const [a,b,c,d]=bounds();return Math.min(c-a,(d-b)/aspect()*1.45)}
function clampCam(v){if(!v)return v;const ar=aspect(),[a,b,c,d]=bounds();let [x,y,w,h]=v;const cx=x+w/2,cy=y+h/2,mw=maxW();
  w=Math.max(Math.min(85,mw),Math.min(mw,w));h=w*ar;x=Math.max(a,Math.min(c-w,cx-w/2));y=h>d-b?(b+d)/2-h/2:Math.max(b,Math.min(d-h,cy-h/2));return[x,y,w,h]}
function targetCam(){const ar=aspect();
  if(mode==='follow'&&viewFloor===C.floor){const w=zoomW,h=w*ar;return[C.x-w/2,C.y-h*0.55,w,h]}
  if(mode==='free'&&FREE)return FREE;
  if(mode==='fit'&&PLAN){const seg=PLAN.segs.find(s=>s.floor===viewFloor);if(seg){const xs=seg.pts.map(p=>p[0]),ys=seg.pts.map(p=>p[1]);
      const x=Math.min(...xs),y=Math.min(...ys);return fitBox(x,y-18,Math.max(60,Math.max(...xs)-x),Math.max(60,Math.max(...ys)-y+18),28)}}
  const [x,y,w,h]=F[viewFloor].vb;return fitBox(x,y,w,h,0)}
function loop(ts){const tc=clampCam(targetCam());if(!cam)cam=tc;cam=cam.map((v,i)=>v+(tc[i]-v)*(mode==='free'?1:0.14));svg.setAttribute('viewBox',cam.map(v=>v.toFixed(2)).join(' '));drawChar(ts);requestAnimationFrame(loop)}
const ptrs=new Map();let drag=null,moved=false;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;drag={cam:cam.slice(),pts:new Map(ptrs)}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!drag)return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  const r=svg.getBoundingClientRect(),k=drag.cam[2]/r.width;
  if(ptrs.size===1){const [sx,sy]=drag.pts.get(e.pointerId)||[e.clientX,e.clientY];const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>6)moved=true;
    if(moved){mode='free';FREE=clampCam([drag.cam[0]-dx*k,drag.cam[1]-dy*k,drag.cam[2],drag.cam[3]])}}
  else if(ptrs.size===2){const a=[...ptrs.values()],b=[...drag.pts.values()];if(b.length<2)return;moved=true;
    const d1=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),d0=Math.hypot(b[0][0]-b[1][0],b[0][1]-b[1][1]);zoomFree(d0/d1,drag.cam)}});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size===0)drag=null;else drag={cam:cam.slice(),pts:new Map(ptrs)}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomFree(e.deltaY>0?1.15:1/1.15,cam)},{passive:false});
function zoomFree(f,base){const [x,y,w,h]=base,nw=Math.max(90,Math.min(900,w*f)),nh=nw*h/w;mode='free';FREE=clampCam([x+(w-nw)/2,y+(h-nh)/2,nw,nh]);zoomW=FREE[2]}
svg.addEventListener('click',ev=>{if(moved)return;const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
  const b=F[viewFloor].bg;if(q.x<b[0]-8||q.x>b[2]+8||q.y<b[1]-8||q.y>b[3]+8)return;if(navigating)return;
  const s=whereIs(viewFloor,q.x,q.y);walkTo({floor:viewFloor,x:q.x,y:q.y,pt:1,label:s?sn(s):''})});

/* ===== route drawing ===== */
function drawRoute(livePts){const g=$('routeG');g.innerHTML='';$('pinG').innerHTML='';
  if(PLAN){for(const s of PLAN.segs){if(s.floor!==viewFloor)continue;const pts=(livePts&&s===curSeg)?livePts:s.pts;if(pts.length<2)continue;
      const d='M'+pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L');
      el('path',{d,fill:'none',stroke:'#1a73e8','stroke-width':4.2,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':'0 7.5'},g);
      el('path',{d,fill:'none',stroke:'#fff','stroke-width':1.4,'stroke-linecap':'round','stroke-dasharray':'0 7.5','stroke-opacity':.0},g)}
    // escalator transfer bubbles
    if(PLAN.rides.length){for(const s of PLAN.segs){if(s.floor!==viewFloor)continue;const isFirst=s===PLAN.segs[0];const n=F[s.floor].nodes[F[s.floor].lift];
      const other=isFirst?PLAN.segs[1].floor:PLAN.segs[0].floor;const txt=(isFirst?'↗ ':'↙ ')+other;
      const bg=el('g',{transform:`translate(${n[0]} ${n[1]-14})`},g);el('rect',{x:-15,y:-6.5,width:30,height:13,rx:6.5,fill:'#fff',stroke:'#1a73e8','stroke-width':.8},bg);
      poiIcon(bg,'esc',-8.5,0,4.2);const tx=el('text',{x:3.5,y:.3,'font-size':5.8,'font-weight':700,fill:'#1a73e8','text-anchor':'middle','dominant-baseline':'middle'},bg);tx.textContent=txt.replace(/^. /,'');}}}
  // highlight destination
  for(const f of ORDER)for(const r of Object.values(F[f].storeEls)){r.setAttribute('stroke','#c9ced6');r.setAttribute('stroke-width',.6)}
  if(DEST&&DEST.floor===viewFloor){const z=DEST.zone||DEST;if(z.x1!==undefined){const r=F[z.floor].storeEls[z.raw+z.x1];if(r){r.setAttribute('stroke','#ea4335');r.setAttribute('stroke-width',1.6)}}
    const p=el('g',{transform:`translate(${DEST.x} ${DEST.y})`},$('pinG'));
    el('path',{d:'M0 0 C-1.5 -5 -7 -8 -7 -13.5 a7 7 0 0 1 14 0 C7 -8 1.5 -5 0 0z',fill:'#ea4335',stroke:'#b31412','stroke-width':.6},p);el('circle',{cx:0,cy:-13.5,r:2.6,fill:'#b31412'},p);
    el('ellipse',{cx:0,cy:.3,rx:2.6,ry:1,fill:'#0004'},p)}}
let curSeg=null;

/* ===== movement ===== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function walk(seg,my,onProg){return new Promise(res=>{const pts=seg.pts;let i=1,last=null;C.walk=1;curSeg=seg;
  function st(ts){if(my!==job){C.walk=0;return res(false)}if(last===null)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;let mv=72*dt;
    while(mv>0&&i<pts.length){const [tx,ty]=pts[i],dx=tx-C.x,dy=ty-C.y,dd=Math.hypot(dx,dy);if(Math.abs(dx)>.3)C.face=dx<0?-1:1;
      if(dd<=mv){C.x=tx;C.y=ty;mv-=dd;i++}else{C.x+=dx/dd*mv;C.y+=dy/dd*mv;mv=0}}
    drawRoute([[C.x,C.y],...pts.slice(i)]);if(onProg)onProg(plen([[C.x,C.y],...pts.slice(i)]));
    if(i>=pts.length){C.walk=0;curSeg=null;return res(true)}requestAnimationFrame(st)}
  requestAnimationFrame(st)})}
async function ride(a,b,my){$('trBig').innerHTML=`${a} <span style="background:none;color:#70757a;padding:0">→</span> <span>${b}</span>`;$('trSm').textContent=t('fac').esc+' · '+tf('escHop',{f:b});
  $('transfer').style.display='flex';for(let k=0;k<=10;k++){C.scale=1-k*.04;C.op=1-k*.08;await sleep(25)}await sleep(850);
  const n=F[b].nodes[F[b].lift];C.floor=b;C.x=n[0];C.y=n[1];setView(b,true);cam=null;
  $('transfer').style.display='none';C.scale=1;C.op=1;return my===job}
async function walkTo(T){const my=++job;setView(C.floor,true);mode='follow';const p=plan(C,T);
  for(const s of p.segs){if(s.floor!==C.floor)break;if(!(await walk(s,my)))return;}
  if(p.rides.length){for(const [a,b] of p.rides)if(!(await ride(a,b,my)))return;await walk(p.segs[1],my)}
  if(my!==job)return;origin=null;afterMove()}
function afterMove(){C.face=1;refreshFrom();if(DEST&&!navigating){PLAN=plan(C,DEST);renderSheet();if(PLAN)drawRoute()}}

/* ===== navigation ===== */
function stepList(p){const S=[];const st=origin||{me:1};
  const a0=whereIs(C.floor,C.x,C.y);
  if(p.rides.length){S.push({ic:'walk',tx:tf('walk',{b:t('fac').esc}),sub:plen(p.segs[0].pts)*MPU<5?'':tf('m',{n:Math.round(plen(p.segs[0].pts)*MPU)}),seg:0});
    p.rides.forEach(([a,b])=>S.push({ic:'esc',tx:tf('ride',{a,b}),sub:''}));
    S.push({ic:'walk',tx:tf('walk',{b:nm(DEST)}),sub:tf('m',{n:Math.round(plen(p.segs[1].pts)*MPU)}),seg:1})}
  else S.push({ic:'walk',tx:tf('walk',{b:nm(DEST)}),sub:tf('m',{n:Math.round(plen(p.segs[0].pts)*MPU)}),seg:0});
  S.push({ic:'pin',tx:tf('arrive',{b:nm(DEST)}),sub:desc(DEST)});return S}
const SI={walk:'<svg viewBox="0 0 24 24" fill="#5f6368"><circle cx="13.5" cy="4.5" r="2"/><path d="M9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6z"/></svg>',
 esc:chipSvg('esc'),pin:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="#ea4335"/><circle cx="12" cy="9" r="2.6" fill="#b31412"/></svg>'};
function setGo(on){const g=$('goTop');g.disabled=!on;g.textContent=navigating?t('stop'):t('start');g.classList.toggle('stop',navigating)}
function renderSheet(active){const box=$('sumBox'),stp=$('steps');setGo(!!DEST);
  if(!DEST){box.innerHTML=`<div class="empty">${t('pick')}</div>`;stp.innerHTML='';return}
  if(!navigating&&C.floor===DEST.floor&&dist([C.x,C.y],[DEST.x,DEST.y])<15){PLAN=null;drawRoute();box.innerHTML=`<div class="sum"><div class="tm">📍 ${t('arrived')}</div></div><div class="via" style="color:#5f6368;font-size:13px;margin-top:4px">${nm(DEST)} · ${desc(DEST)}</div>`;stp.innerHTML='';setGo(false);return}
  if(!PLAN)PLAN=plan(C,DEST);const m=metrics(PLAN);
  box.innerHTML=`<div class="sum"><div style="flex:1"><div class="tm">${tf('min',{n:m.min})}<small>(${tf('m',{n:m.m})})</small></div><div class="via">${PLAN.rides.length?PLAN.from+' → '+PLAN.to+' · '+tf('via',{n:PLAN.rides.length}):t('same')}</div></div></div>
`;
  const S=stepList(PLAN);stp.innerHTML='';S.forEach((s,i)=>{const d=document.createElement('div');d.className='st'+(i===active?' cur':'');
    d.innerHTML=`<div class="si">${SI[s.ic]}</div><div class="sx"></div>`;d.lastChild.textContent=s.tx;if(s.sub){const sm=document.createElement('small');sm.textContent=s.sub;d.lastChild.appendChild(sm)}stp.appendChild(d)})}
function navShow(ic,txt,sub){$('navbar').style.display='flex';$('navI').textContent=ic;$('navT').textContent=txt;$('navS').textContent=sub||''}
async function startNav(){if(!DEST)return;const my=++job;navigating=true;mode='follow';setView(C.floor,true);PLAN=plan(C,DEST);const p=PLAN,S=stepList(p);renderSheet(0);
  let si=0;const nav=(i,rem)=>{const s=S[i];navShow(s.ic==='esc'?'⇅':s.ic==='pin'?'📍':'↑',s.tx,rem!=null?tf('m',{n:Math.round(rem*MPU)}):s.sub)};
  nav(0);if(!(await walk(p.segs[0],my,r=>nav(0,r))))return;si=1;
  for(const [a,b] of p.rides){renderSheet(si);nav(si);if(!(await ride(a,b,my)))return;si++}
  if(p.rides.length){renderSheet(si);nav(si);if(!(await walk(p.segs[1],my,r=>nav(si,r))))return;si++}
  renderSheet(si);navShow('🏁',t('arrived'),nm(DEST));C.face=1;refreshFrom();celebrate();
  await sleep(2600);if(my!==job)return;navigating=false;$('navbar').style.display='none';PLAN=plan(C,DEST);renderSheet();if(PLAN)drawRoute()}
function stopNav(){job++;navigating=false;C.walk=0;$('navbar').style.display='none';$('transfer').style.display='none';C.scale=1;C.op=1;afterMove()}
function celebrate(){const g=el('g',{},$('pinG'));const cs=['#ea4335','#fbbc04','#34a853','#1a73e8'];
  for(let k=0;k<20;k++){const a=Math.random()*Math.PI*2,r=8+Math.random()*16;const c=el('circle',{cx:C.x,cy:C.y-14,r:1.3,fill:cs[k%4]},g);
    c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-6}px)`,opacity:0}],{duration:1100,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'})}
  setTimeout(()=>g.remove(),1300)}

/* ===== UI ===== */
function setView(f,keep){viewFloor=f;ORDER.forEach(x=>$('fl_'+x).style.display=x===f?'':'none');if(!keep&&!navigating)mode=(PLAN&&PLAN.segs.some(s=>s.floor===f))?'fit':'overview';drawFloorSw();drawPois();drawRoute()}
function drawFloorSw(){const w=$('floorSw');w.innerHTML='';[...ORDER].reverse().forEach(f=>{const b=document.createElement('button');b.textContent=f;if(f===viewFloor)b.className='on';
  if(C.floor===f)b.innerHTML+='<i style="background:#1a73e8"></i>';else if(DEST&&DEST.floor===f)b.innerHTML+='<i style="background:#ea4335"></i>';
  b.onclick=()=>setView(f);w.appendChild(b)})}
function refreshFrom(){const s=whereIs(C.floor,C.x,C.y);$('inFrom').value=t('my')+' · '+(origin?nm(origin):s?sn(s):t('corr').replace('{f}',C.floor))+' ('+C.floor+')'}
function setDest(o){DEST=o;$('inTo').value=nm(o)+' · '+o.floor;PLAN=plan(C,DEST);renderSheet();setView(C.floor===o.floor?o.floor:C.floor);mode='fit';drawFloorSw();drawRoute()}
function nearestOf(types){let b=null,bc=1e9;for(const o of ALL)if(o.poi&&types.includes(o.poi)){const c=cost(C,o);if(c<bc){bc=c;b=o}}return b}
function search(q){q=q.trim().toLowerCase().replace(/\s+/g,' ');if(!q)return[];
  return ALL.filter(o=>((o.name||'')+' '+(o.ko||'')+' '+(o.poi?Object.values(T).map(x=>x.fac[o.poi]+' toilet wc restroom 화장실').join(' '):'')).toLowerCase().includes(q)).slice(0,30)}
function icFor(o){if(o.poi)return chipSvg(o.poi).replace('<svg','<svg width="22" height="22"');return'<svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="#9aa0a6"/></svg>'}
function bindSearch(inp,ls,set,restore){inp.onfocus=()=>{inp.value='';show()};inp.oninput=show;
  function show(){const r=search(inp.value);ls.innerHTML='';if(!inp.value.trim()){ls.style.display='none';return}
    if(!r.length)ls.innerHTML=`<div>${t('none')}</div>`;
    for(const o of r){const d=document.createElement('div');d.innerHTML=`<span class="ic">${icFor(o)}</span><span class="tx"><b></b><span></span></span>`;
      d.querySelector('b').textContent=nm(o)+(L==='ko'&&o.ko&&!o.poi?'  '+o.name:'');d.querySelector('.tx span').textContent=desc(o);
      d.onmousedown=ev=>ev.preventDefault();d.onclick=()=>{set(o);ls.style.display='none';inp.blur()};ls.appendChild(d)}
    ls.style.display='block'}
  inp.onblur=()=>setTimeout(()=>{ls.style.display='none';restore()},200)}
bindSearch($('inFrom'),$('lsFrom'),o=>{job++;navigating=false;$('navbar').style.display='none';C.walk=0;C.floor=o.floor;C.x=o.x;C.y=o.poi?o.y+8:o.y+3;origin=o;mode='follow';cam=null;setView(o.floor,true);afterMove()},refreshFrom);
bindSearch($('inTo'),$('lsTo'),setDest,()=>{$('inTo').value=DEST?nm(DEST)+' · '+DEST.floor:''});
$('swap').onclick=()=>{if(!DEST||navigating)return;const prev={floor:C.floor,x:C.x,y:C.y,pt:1,label:origin?nm(origin):(whereIs(C.floor,C.x,C.y)?sn(whereIs(C.floor,C.x,C.y)):'')};
  const o=DEST;C.floor=o.floor;C.x=o.x;C.y=o.poi?o.y+8:o.y+3;origin=o;DEST=prev;$('inTo').value=nm(prev)+' · '+prev.floor;cam=null;mode='follow';setView(C.floor,true);afterMove()};
$('recenter').onclick=()=>{mode='follow';setView(C.floor,true)};
$('zin').onclick=()=>{if(mode==='follow')zoomW=Math.max(90,zoomW/1.4);else zoomFree(1/1.4,cam)};
$('zout').onclick=()=>{if(mode==='follow')zoomW=Math.min(maxW(),zoomW*1.4);else zoomFree(1.4,cam)};
function applyLang(){document.documentElement.lang={ko:'ko',zh:'zh-CN',tw:'zh-TW',en:'en',ja:'ja',vi:'vi',th:'th',fil:'fil'}[L];document.title=t('title');$('brandbar').textContent=t('title');
  $('inFrom').placeholder=t('fromPh');$('inTo').placeholder=t('toPh');$('note').textContent=t('note');$('toast').textContent=t('hint');
  $('chips').innerHTML=`<button class="chip" data-k="wc">${chipSvg('wc')}${t('chipWc')}</button><button class="chip" data-k="awc">${chipSvg('awc')}${t('fac').awc}</button><button class="chip" data-k="esc">${chipSvg('esc')}${t('chipEsc')}</button><button class="chip" data-k="info">${chipSvg('info')}${t('chipInfo')}</button>`;
  $('lang').value=L;if(!window._langBound){window._langBound=1;$('lang').onchange=e=>{L=e.target.value;try{localStorage.setItem('sdf_lang',L)}catch(_){};applyLang()}};
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const o=nearestOf([k]);if(o)setDest(o)});
  $('legend').innerHTML=Object.entries(t('cat')).filter(([k])=>k!=='z').map(([k,v])=>`<span><b style="background:${COL[k]}"></b>${v}</span>`).join('');
  refreshFrom();if(DEST)$('inTo').value=nm(DEST)+' · '+DEST.floor;renderSheet();drawPois();drawRoute()}

$('goTop').onclick=()=>navigating?stopNav():startNav();
// Kiosk / QR start point: #loc-1F-450-278
function fromHash(){const m=/^#loc-(B1F|1F|2F|2MF|3F)-(\d+)-(\d+)$/i.exec(location.hash);if(!m)return;C.floor=m[1].toUpperCase();C.x=+m[2];C.y=+m[3];origin=null;setView(C.floor,true);cam=null;afterMove()}
window.addEventListener('hashchange',fromHash);
setView('1F',true);fromHash();applyLang();requestAnimationFrame(loop);
setTimeout(()=>$('toast').style.opacity=0,5000);
</script>
